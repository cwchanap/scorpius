[package]
name = "scorpius"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
bevy = "0.19"
bevy_e2e = { git = "https://github.com/cwchanap/bevy-e2e", rev = "13f5d331ade246d1248d6ce6ffdb80e65e5765d7", default-features = false, features = [
    "runtime",
], optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
bevy_e2e = { git = "https://github.com/cwchanap/bevy-e2e", rev = "13f5d331ade246d1248d6ce6ffdb80e65e5765d7" }

[features]
e2e = ["dep:bevy_e2e"]
ui-capture = []

[[example]]
name = "ui_capture"
path = "examples/ui_capture.rs"
required-features = ["ui-capture"]
test = false

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3
