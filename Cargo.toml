[package]
name = "scorpius"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
bevy = "0.19"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[features]
ui-capture = []

[[example]]
name = "ui_capture"
path = "examples/ui_capture.rs"
required-features = ["ui-capture"]
test = false

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3
