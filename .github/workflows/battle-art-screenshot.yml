name: Battle art screenshot

on:
  push:
    branches:
      - anime-battle-token-art

permissions:
  contents: write

concurrency:
  group: battle-art-screenshot-${{ github.ref }}
  cancel-in-progress: true

jobs:
  capture:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install headless graphics dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes \
            g++ pkg-config libx11-dev libasound2-dev libudev-dev \
            libxkbcommon-x11-0 libwayland-dev libxkbcommon-dev \
            xvfb mesa-vulkan-drivers libvulkan1 vulkan-tools python3-pil \
            imagemagick openbox wmctrl xdotool
      - name: Restore and normalize mech art
        run: |
          cat .github/art-chunks/interceptor-*.b64 | tr -d '\n' | base64 -d > assets/ui/interceptor.png
          python3 - <<'PY'
          from PIL import Image
          from pathlib import Path
          for name in ('vanguard', 'gunner', 'interceptor'):
              path = Path('assets/ui') / f'{name}.png'
              image = Image.open(path).convert('RGBA')
              image.load()
              image.save(path, format='PNG', optimize=False, compress_level=6)
              print(name, image.size, image.mode)
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/ui/vanguard.png assets/ui/gunner.png assets/ui/interceptor.png
          if ! git diff --cached --quiet; then
            git commit -m "fix: restore Bevy-compatible anime mech assets [skip ci]"
            git push origin HEAD:anime-battle-token-art
          fi
      - name: Verify lavapipe
        run: |
          export VK_ICD_FILENAMES=$(find /usr/share/vulkan/icd.d -name '*lvp*.json' | head -1)
          vulkaninfo --summary
      - run: rustup update stable
      - run: rustup default stable
      - name: Use fast unoptimized profile for screenshot build
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('Cargo.toml')
          s = p.read_text().replace('opt-level = 1', 'opt-level = 0').replace('opt-level = 3', 'opt-level = 0')
          p.write_text(s)
          PY
      - name: Keep deterministic battle window alive for external capture
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('examples/ui_capture.rs')
          s = p.read_text()
          target_start = s.index('fn configure_capture_target(')
          target_end = s.index('\nfn advance_capture_time(', target_start)
          s = s[:target_start] + 'fn configure_capture_target(_world: &mut World) -> bool {\n    true\n}\n' + s[target_end:]
          finish_start = s.index('fn finish_capture(')
          body_start = s.index('    let (output, width, height, time_ms, target_image) = {', finish_start)
          body_end = s.index('\n}\n\n/// Validate, encode, and save the capture', body_start)
          replacement = '    let output = world.resource::<CaptureRun>().output.clone();\n    let ready = output.with_extension("ready");\n    fs::write(&ready, b"ready").expect("write capture-ready marker");\n    world.resource_mut::<CaptureRun>().capture_requested = true;'
          s = s[:body_start] + replacement + s[body_end:]
          p.write_text(s)
          PY
      - run: mkdir -p artifacts
      - name: Build screenshot fixture
        env:
          CARGO_PROFILE_DEV_DEBUG: "0"
          CARGO_INCREMENTAL: "0"
        run: cargo build --features ui-capture --example ui_capture
      - name: Capture actual Scorpius window
        run: |
          xvfb-run -a -s '-screen 0 1920x1080x24' bash -lc '
            set -e
            openbox >/tmp/openbox.log 2>&1 &
            sleep 1
            export VK_ICD_FILENAMES=$(find /usr/share/vulkan/icd.d -name "*lvp*.json" | head -1)
            export WGPU_BACKEND=vulkan
            export LIBGL_ALWAYS_SOFTWARE=1
            target/debug/examples/ui_capture \
              --scenario battle-idle \
              --size 1920x1080 \
              --output artifacts/battle-anime-art.png &
            app_pid=$!
            for i in $(seq 1 120); do
              [ -f artifacts/battle-anime-art.ready ] && break
              if ! kill -0 "$app_pid" 2>/dev/null; then
                wait "$app_pid"
                exit 1
              fi
              sleep 0.5
            done
            test -f artifacts/battle-anime-art.ready
            sleep 2
            echo "Visible windows:"
            wmctrl -lG || true
            xwininfo -root -tree || true
            window_id=$(wmctrl -lG | awk "BEGIN {best=0; id=\"\"} NF>=7 {area=\$5*\$6; if (area>best) {best=area; id=\$1}} END {print id}")
            test -n "$window_id"
            echo "Capturing window $window_id"
            xdotool windowactivate --sync "$window_id" || true
            sleep 1
            import -window "$window_id" artifacts/battle-anime-art.png
            kill "$app_pid" || true
            wait "$app_pid" || true
          '
          python3 - <<'PY'
          from PIL import Image
          image = Image.open('artifacts/battle-anime-art.png').convert('RGB')
          colors = image.getcolors(maxcolors=image.width * image.height)
          if not colors or len(colors) < 64:
              raise SystemExit(f'window screenshot is blank or nearly uniform: {0 if not colors else len(colors)} colors')
          print('captured', image.size, 'unique_colors', len(colors))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: battle-anime-art-screenshot
          path: artifacts/battle-anime-art.png
