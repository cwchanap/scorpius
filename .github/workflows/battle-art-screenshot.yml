name: Battle art screenshot

on:
  push:
    branches:
      - anime-battle-token-art

permissions:
  contents: write

concurrency:
  group: battle-art-screenshot-${{ github.ref }}
  cancel-in-progress: true

jobs:
  capture:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install headless graphics dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes \
            g++ pkg-config libx11-dev libasound2-dev libudev-dev \
            libxkbcommon-x11-0 libwayland-dev libxkbcommon-dev \
            xvfb mesa-vulkan-drivers libvulkan1 vulkan-tools python3-pil
      - name: Restore and normalize mech art
        run: |
          cat .github/art-chunks/interceptor-*.b64 | tr -d '\n' | base64 -d > assets/ui/interceptor.png
          python3 - <<'PY'
          from PIL import Image
          from pathlib import Path
          for name in ('vanguard', 'gunner', 'interceptor'):
              path = Path('assets/ui') / f'{name}.png'
              image = Image.open(path).convert('RGBA')
              image.load()
              image.save(path, format='PNG', optimize=False, compress_level=6)
              print(name, image.size, image.mode)
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/ui/vanguard.png assets/ui/gunner.png assets/ui/interceptor.png
          if ! git diff --cached --quiet; then
            git commit -m "fix: restore Bevy-compatible anime mech assets [skip ci]"
            git push origin HEAD:anime-battle-token-art
          fi
      - name: Verify lavapipe
        run: |
          export VK_ICD_FILENAMES=$(find /usr/share/vulkan/icd.d -name '*lvp*.json' | head -1)
          echo "VK_ICD_FILENAMES=$VK_ICD_FILENAMES"
          vulkaninfo --summary
      - run: rustup update stable
      - run: rustup default stable
      - name: Use fast unoptimized profile for screenshot build
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('Cargo.toml')
          s = p.read_text()
          s = s.replace('opt-level = 1', 'opt-level = 0')
          s = s.replace('opt-level = 3', 'opt-level = 0')
          p.write_text(s)
          PY
      - name: Capture primary window instead of offscreen target
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('examples/ui_capture.rs')
          s = p.read_text()
          target_start = s.index('fn configure_capture_target(')
          target_end = s.index('\nfn advance_capture_time(', target_start)
          s = s[:target_start] + 'fn configure_capture_target(_world: &mut World) -> bool {\n    true\n}\n' + s[target_end:]
          finish_start = s.index('fn finish_capture(')
          tuple_start = s.index('    let (output, width, height, time_ms, target_image) = {', finish_start)
          tuple_end = s.index('    eprintln!(', tuple_start)
          replacement = '    let (output, width, height, time_ms) = {\n        let run = world.resource::<CaptureRun>();\n        (run.output.clone(), run.width, run.height, run.time_ms)\n    };\n'
          s = s[:tuple_start] + replacement + s[tuple_end:]
          old_screenshot = 'let screenshot = world.spawn(Screenshot::image(target_image)).id();'
          if old_screenshot not in s:
              raise SystemExit('offscreen screenshot call not found')
          s = s.replace(old_screenshot, 'let screenshot = world.spawn(Screenshot::primary_window()).id();', 1)
          p.write_text(s)
          PY
      - run: mkdir -p artifacts
      - name: Capture battle with generated art
        env:
          CARGO_PROFILE_DEV_DEBUG: "0"
          CARGO_INCREMENTAL: "0"
        run: |
          export VK_ICD_FILENAMES=$(find /usr/share/vulkan/icd.d -name '*lvp*.json' | head -1)
          export WGPU_BACKEND=vulkan
          export LIBGL_ALWAYS_SOFTWARE=1
          xvfb-run -a cargo run --features ui-capture --example ui_capture -- \
            --scenario battle-idle \
            --size 1920x1080 \
            --output artifacts/battle-anime-art.png
      - uses: actions/upload-artifact@v4
        with:
          name: battle-anime-art-screenshot
          path: artifacts/battle-anime-art.png
